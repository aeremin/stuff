# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase on merge
on:
  push:
    branches:
      - master
concurrency:
  group: deploy-live
  cancel-in-progress: false
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
      # Functions go first: the Hosting rewrites point at the mcp function.
      - run: npm ci --prefix functions
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STUFF_11062 }}
      # Builds functions/ through the predeploy hook in firebase.json.
      # Unchanged functions are skipped; --force lets the CLI set up the
      # Artifact Registry cleanup policy instead of prompting for it.
      - run: npx --yes firebase-tools@15.12.0 deploy --only functions --project stuff-11062 --non-interactive --force
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STUFF_11062 }}
          channelId: live
          projectId: stuff-11062
